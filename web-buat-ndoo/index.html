<!DOCTYPE html>
<html>
<head>
    <title>Untuk Kamu ❤️</title>
    <style>
        body {
            font-family: Arial;
            text-align: center;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            color: white;
            overflow: hidden;
        }

        img {
            width: 150px;
            weight: 150px;
            object-fit: cover;
        }

        button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            background: white;
            color: #ff4d6d;
            font-weight: bold;
        }

        .hidden {
            display: none;
        }

        /* love jatuh */
        .love {
            position: fixed;
            top: -10px;
            animation: jatuh 5s linear infinite;
        }

        @keyframes jatuh {
            0% {transform: translateY(0);}
            100% {transform: translateY(100vh);}
        }

        /* SURPRISE */
        #surprise {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ff4d6d;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            font-size: 25px;
        }
    </style>
</head>

<body>

<h1>Hai Ijull❤️</h1>
<p id="typing"></p>

<img src="foto1.jpg">
<img src="foto2.jpg">
<img src="foto3.jpg">

<br>

<button onclick="mulai()">Klik Aku 😜</button>

<div id="game" class="hidden">
    <h2>Kamu sayang aku ga? 🤨</h2>
    <button onclick="benar()">Sayang banget 💖</button>
    <button onclick="salah()">Hmm... biasa aja 😅</button>
</div>

<div id="surprise" class="hidden">
    <h1>🎉 SURPRISE 🎉</h1>
    <p>Loveee Youuuu ijulll ❤️</p>
    <p>Baraeng-barengg teruss yaa 🥺</p>
    <p>Kamu itu rumah aku 🏡💞</p>
</div>

<script>
// efek ketik
let text = "Aku cuma mau nunjukin sesuatu... 😆";
let i = 0;
function ketik() {
    if (i < text.length) {
        document.getElementById("typing").innerHTML += text.charAt(i);
        i++;
        setTimeout(ketik, 50);
    }
}
ketik();

// tampilkan game
function mulai() {
    document.getElementById("game").classList.remove("hidden");
}

// jawaban benar → munculin surprise
function benar() {
    document.getElementById("surprise").classList.remove("hidden");
}

// tombol salah kabur 😂
function salah() {
    let btn = event.target;
    btn.style.position = "absolute";
    btn.style.left = Math.random() * 80 + "%";
    btn.style.top = Math.random() * 80 + "%";
}

// love jatuh
function buatLove() {
    let love = document.createElement("div");
    love.innerHTML = "💖";
    love.classList.add("love");
    love.style.left = Math.random() * 100 + "vw";
    love.style.fontSize = (10 + Math.random() * 20) + "px";
    document.body.appendChild(love);

    setTimeout(() => {
        love.remove();
    }, 5000);
}

setInterval(buatLove, 300);
</script>

</body>
</html>
